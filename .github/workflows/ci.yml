name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: fdroid
            task: Fdroid
          - flavor: play
            task: Play
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Lint
        run: ./gradlew lint${{ matrix.task }}Debug
      - name: Build debug APK
        run: ./gradlew assemble${{ matrix.task }}Debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.flavor }}-debug-${{ github.sha }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error
          retention-days: 7
